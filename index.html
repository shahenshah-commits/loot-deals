<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahenshah Luxury Deals</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            padding: 30px 10px;
        }
        h1 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }
        .product-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .product-info .price {
            margin: 0;
            color: #34d399;
            font-weight: bold;
            font-size: 15px;
        }
        .buy-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 10px 22px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: background 0.3s;
        }
        .buy-btn:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>👑 Shahenshah Luxury Store 👑</h1>
            <p>चुनिंदा एक्सक्लूसिव और सबसे बेहतरीन ऑफर्स की सूची</p>
        </div>

        <!-- प्रोडक्ट 1 -->
        <div class="product-card">
            <div class="product-info">
                <h3>🔥 Stylish Printed T-Shirt</h3>
                <p class="price">₹90 Only</p>
            </div>
            <a href="यहाँ_पहला_EarnKaro_लिंक_डालें" class="buy-btn" target="_blank">Grab Deal</a>
        </div>

        <!-- प्रोडक्ट 2 -->
        <div class="product-card">
            <div class="product-info">
                <h3>⚡ Trending Product Name 2</h3>
                <p class="price">₹ कीमत लिखें</p>
            </div>
            <a href="यहाँ_दूसरा_EarnKaro_लिंक_डालें" class="buy-btn" target="_blank">Grab Deal</a>
        </div>

        <!-- प्रोडक्ट 3 (आप जितने चाहें ऐसे ही नीचे कॉपी-पेस्ट करके बढ़ा सकते हैं) -->
        <div class="product-card">
            <div class="product-info">
                <h3>💎 Premium Product Name 3</h3>
                <p class="price">₹ कीमत लिखें</p>
            </div>
            <a href="यहाँ_तीसरा_EarnKaro_लिंक_डालें" class="buy-btn" target="_blank">Grab Deal</a>
        </div>

    </div>

</body>
</html>
